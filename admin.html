}</script><script>
const initial=JSON.parse(document.getElementById('initialData').textContent);let data=structuredClone(initial);let selected=-1,selectedSongAlias='',selectedEventAlias='';const $=id=>document.getElementById(id);
const SUPABASE_URL='https://iatptvcykpqlhsvjbcsy.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_wDCbjeR04VJ8mXafc4v7dg_hw8bo3lZ';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function persist(){$('status').textContent='수정 사항이 있습니다 · 클라우드 저장을 눌러 반영하세요';renderList();renderAliases()}
async function verifyAndLoad(session){
  const {data:adminOk,error:adminError}=await supabaseClient.rpc('is_setlist_admin');
  if(adminError||adminOk!==true){await supabaseClient.auth.signOut();throw new Error('이 계정은 관리자 권한이 없습니다.')}

  else{data=structuredClone(initial);const {error:insertError}=await supabaseClient.from('setlist_data').upsert({id:1,data,updated_at:new Date().toISOString()});if(insertError)throw insertError;$('status').textContent='최초 데이터 42개 공연을 클라우드에 등록했습니다.'}

supabaseClient.auth.getSession().then(({data})=>handleSession(data.session));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){const q=$('filter').value.toLowerCase();$('count').textContent='('+data.performances.length+')';$('eventList').innerHTML=data.performances.map((p,i)=>({p,i})).filter(({p})=>(p.title+' '+p.date+' '+p.venue).toLowerCase().includes(q)).map(({p,i})=>`<button class="item ${i===selected?'active':''}" data-i="${i}">${esc(p.title)}<small>${esc(p.date)} · ${esc(p.venue)}</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>selectEvent(+b.dataset.i))}
function selectEvent(i){selected=i;const p=data.performances[i];$('empty').classList.add('hidden');$('eventForm').classList.remove('hidden');$('date').value=p.date;$('title').value=p.title;$('venue').value=p.venue;$('artist').value=p.artist;renderSongs(p.songs);renderList()}function renderSongs(s) {
  const container = $('songs');
  container.replaceChildren();

  let songs = [];

  if (Array.isArray(s)) {
    songs = s.map(song => {
      if (typeof song === 'string') return song;

      if (song && typeof song.textContent === 'string') {
        return song.textContent;
      }

      if (song && typeof song === 'object') {
        return song.name || song.title || song.value || '';
      }

      return '';
    });
  } else if (typeof s === 'string') {
    songs = s.split('|');
  }

  songs
    .map(song => String(song).trim())
    .filter(Boolean)
    .forEach(song => {
      container.append(songRow(song));
    });
}
function songRow(v=''){const d=document.createElement('div');d.className='song-row';d.innerHTML=`<input value="${esc(v)}" aria-label="곡명"><button type="button" title="위로">↑</button><button type="button" title="아래로">↓</button><button type="button" title="삭제">×</button>`;d.children[1].onclick=()=>{if(d.previousElementSibling)d.parentNode.insertBefore(d,d.previousElementSibling)};d.children[2].onclick=()=>{if(d.nextElementSibling)d.parentNode.insertBefore(d.nextElementSibling,d)};d.children[3].onclick=()=>d.remove();return d}
$('addSong').onclick=()=> $('songs').append(songRow());$('pasteSongs').onclick=()=>{const t=prompt('곡명을 | 또는 줄바꿈으로 구분해 붙여넣으세요.');if(t!==null){$('songs').innerHTML='';t.split(/[|\n]/).map(x=>x.trim()).filter(Boolean).forEach(x=>$('songs').append(songRow(x)))}};$('newBtn').onclick=()=>{selected=-1;$('empty').classList.add('hidden');$('eventForm').classList.remove('hidden');$('eventForm').reset();$('songs').innerHTML='';$('artist').value='87dance';renderList()};$('eventForm').onsubmit=e=>{e.preventDefault();const p={date:$('date').value,title:$('title').value.trim(),venue:$('venue').value.trim(),artist:$('artist').value.trim(),songs:[...$('songs').querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean).join('|')};if(selected<0){data.performances.push(p);selected=data.performances.length-1}else data.performances[selected]=p;data.performances.sort((a,b)=>a.date.localeCompare(b.date));selected=data.performances.indexOf(p);persist();selectEvent(selected)};$('deleteBtn').onclick=()=>{if(selected>=0&&confirm('이 공연을 삭제할까요?')){data.performances.splice(selected,1);selected=-1;$('eventForm').classList.add('hidden');$('empty').classList.remove('hidden');persist()}};$('filter').oninput=renderList;
function renderAliases(){for(const [key,id] of [['songAliases','songAliasList'],['eventAliases','eventAliasList']])$(id).innerHTML=Object.keys(data[key]).sort().map(k=>`<button class="item" data-alias="${esc(k)}" data-kind="${key}">${esc(k)}<small>${esc(data[key][k].join(', '))}</small></button>`).join('');document.querySelectorAll('[data-alias]').forEach(b=>b.onclick=()=>{const k=b.dataset.kind,canonical=b.dataset.alias; if(k==='songAliases'){selectedSongAlias=canonical;$('songCanonical').value=canonical;$('songAliasValues').value=data[k][canonical].join(', ')}else{selectedEventAlias=canonical;$('eventCanonical').value=canonical;$('eventAliasValues').value=data[k][canonical].join(', ')}})}
function saveAlias(kind,keyId,valId,selectedKey){const key=$(keyId).value.trim();if(!key)return alert('기준 이름을 입력해 주세요.');const aliases=$(valId).value.split(',').map(x=>x.trim()).filter(Boolean);if(selectedKey&&selectedKey!==key)delete data[kind][selectedKey];data[kind][key]=aliases;persist();return key}
$('saveSongAlias').onclick=()=>selectedSongAlias=saveAlias('songAliases','songCanonical','songAliasValues',selectedSongAlias)||selectedSongAlias;$('deleteSongAlias').onclick=()=>{if(selectedSongAlias&&confirm('별칭을 삭제할까요?')){delete data.songAliases[selectedSongAlias];selectedSongAlias='';$('songCanonical').value=$('songAliasValues').value='';persist()}};$('saveEventAlias').onclick=()=>selectedEventAlias=saveAlias('eventAliases','eventCanonical','eventAliasValues',selectedEventAlias)||selectedEventAlias;$('deleteEventAlias').onclick=()=>{if(selectedEventAlias&&confirm('별칭을 삭제할까요?')){delete data.eventAliases[selectedEventAlias];selectedEventAlias='';$('eventCanonical').value=$('eventAliasValues').value='';persist()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('eventsTab').classList.toggle('hidden',b.dataset.tab!=='events');$('aliasesTab').classList.toggle('hidden',b.dataset.tab!=='aliases')});$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='87dance-setlist-data.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.performances)||!x.songAliases||!x.eventAliases)throw Error();data=x;selected=-1;persist();$('eventForm').classList.add('hidden');$('empty').classList.remove('hidden');alert('데이터를 불러왔습니다.')}catch{alert('올바른 87dance JSON 파일이 아닙니다.')}};$('resetBtn').onclick=()=>{if(confirm('초기 데이터로 복원할까요? 현재 브라우저에 저장된 변경 사항은 사라집니다.')){data=structuredClone(initial);selected=-1;persist();$('eventForm').classList.add('hidden');$('empty').classList.remove('hidden')}};renderList();renderAliases();
</script></body></html>
