
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87dance SETLIST</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root {
  --bg: #f5f4ef;
  --ink: #20201e;
  --accent: #ed5637;
  --line: #d9d8d1;
  --muted: #88877f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans','Noto Sans KR',sans-serif;
}
header {
  padding: 24px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.logo { font-weight: 900; font-size: 21px; letter-spacing: -1px; }
.logo span { color: var(--accent); }
.header-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
main { max-width: 1100px; margin: auto; padding: 65px 6%; }
.hero { margin-bottom: 55px; }
.eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--accent); font-weight: 800; }
h1 {
  font-size: clamp(48px, 10vw, 100px);
  line-height: .95;
  letter-spacing: -7px;
  margin: 18px 0;
  font-weight: 900;
}
h1 span { color: var(--accent); }
.subtitle { color: var(--muted); font-size: 14px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.month-title { font-size: 27px; font-weight: 800; }
.nav { display: flex; gap: 8px; }
.nav button {
  background: transparent; border: 1px solid var(--line);
  width: 38px; height: 38px; cursor: pointer; font-size: 18px;
}
.weekdays, .calendar {
  display: grid;
  grid-template-columns: repeat(7,1fr);
}
.weekdays div {
  padding: 13px 4px; font-size: 11px;
  color: var(--muted); text-align: center;
  border-bottom: 1px solid var(--line);
}
.day {
  min-height: 85px; border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent; position: relative;
  cursor: pointer; font: inherit; font-size: 14px;
}
.day:hover { background: #ebe9e1; }
.day.selected { background: var(--ink); color: white; }
.day.has-show::after {
  content: ''; position: absolute; bottom: 13px;
  left: 50%; transform: translateX(-50%);
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}
.day.selected.has-show::after { background: white; }
.day.empty { cursor: default; }
.details {
  margin-top: 65px; padding: 30px 0;
  border-top: 2px solid var(--ink);
}
.detail-date { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 2px; }
.detail-title { font-size: 32px; font-weight: 900; margin: 12px 0; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 35px; }
.setlist-head {
  display: flex; justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px; font-size: 11px;
  letter-spacing: 2px; font-weight: 800;
}
.song {
  display: flex; padding: 14px 5px;
  border-bottom: 1px solid var(--line);
  font-size: 14px; gap: 20px;
}
.song-num { color: var(--accent); width: 25px; font-weight: 800; }
.empty-message { color: var(--muted); padding: 30px 0; font-size: 14px; }
.search-area {
  margin-top: 70px; padding-top: 35px;
  border-top: 2px solid var(--ink);
}
.search-title { font-size: 28px; font-weight: 900; margin-bottom: 20px; }
.search-box { display: flex; border-bottom: 2px solid var(--ink); }
.search-box input {
  flex: 1; min-width: 0; padding: 15px 5px;
  border: 0; background: transparent;
  font: inherit; font-size: 16px; outline: none;
}
.search-box button {
  background: var(--accent); color: white;
  border: 0; padding: 0 25px; cursor: pointer;
  font-weight: 700;
}
.result { padding: 16px 5px; border-bottom: 1px solid var(--line); cursor: pointer; }
.result:hover { background: #ebe9e1; }
.result small { color: var(--accent); font-weight: 700; }
footer {
  padding: 30px 6%; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
}
@media(max-width:600px) {
  main { padding: 45px 5%; }
  h1 { letter-spacing: -4px; }
  .day { min-height: 58px; }
  .detail-title { font-size: 25px; }
  header { padding: 20px 5%; }
  .header-label { font-size: 9px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">87dance<span>.</span></div>
  <div class="header-label">LIVE PERFORMANCE ARCHIVE</div>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">MUSIC ARCHIVE / 001</div>
    <h1>87dance<br><span>SETLIST.</span></h1>
    <p class="subtitle">A collection of live performances &amp; memories.</p>
  </section>

  <section>
    <div class="section-head">
      <div class="month-title" id="monthTitle"></div>
      <div class="nav">
        <button id="prev" aria-label="이전 달">←</button>
        <button id="next" aria-label="다음 달">→</button>
      </div>
    </div>
    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div>
      <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </section>

  <section class="details" id="details">
    <div class="detail-date" id="detailDate">SELECT A DATE</div>
    <div class="detail-title" id="detailTitle">공연 날짜를 선택해 주세요.</div>
    <div class="meta" id="meta">캘린더에서 날짜를 클릭하면 공연 기록이 나타납니다.</div>
    <div id="songs"></div>
  </section>

  <section class="search-area">
    <div class="eyebrow">FIND YOUR SONG</div>
    <div class="search-title">SEARCH SETLIST.</div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="곡 제목을 검색하세요">
      <button id="searchBtn">SEARCH ↗</button>
    </div>
    <div id="results" aria-live="polite"></div>
  </section>
</main>
<footer>
  <span>87dance SETLIST ARCHIVE</span>
  <span>MADE FOR MUSIC.</span>
</footer>

<script>
// 공연 데이터: 실제 공연 기록으로 교체해 주세요.
const performances = [
  {
    date: "2026-11-05",
    title: "AUTUMN LIVE",
    venue: "ROLLING HALL",
    time: "19:00",
    songs: ["Sample Song A", "Sample Song B", "Sample Song C", "Sample Song D"]
  },
  {
    date: "2026-11-12",
    title: "CLUB PERFORMANCE",
    venue: "MUSIC SPACE",
    time: "18:00",
    songs: ["Sample Song B", "Sample Song E", "Sample Song F"]
  },
  {
    date: "2026-10-21",
    title: "LIVE SESSION",
    venue: "HONGDAE",
    time: "19:30",
    songs: ["Sample Song A", "Sample Song D", "Sample Song G"]
  }
];

let current = new Date(2026, 10, 1);
let selectedDate = null;

function renderCalendar() {
  const year = current.getFullYear();
  const month = current.getMonth();
  document.getElementById('monthTitle').textContent =
    `${year} / ${String(month + 1).padStart(2,'0')}`;

  const first = new Date(year, month, 1).getDay();
  const total = new Date(year, month + 1, 0).getDate();
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  for (let i = 0; i < first; i++) {
    const blank = document.createElement('div');
    blank.className = 'day empty';
    cal.appendChild(blank);
  }

  for (let d = 1; d <= total; d++) {
    const date = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const btn = document.createElement('button');
    btn.className = 'day';
    btn.textContent = d;
    if (performances.some(p => p.date === date)) btn.classList.add('has-show');
    if (selectedDate === date) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      selectedDate = date;
      renderCalendar();
      renderDetails(date);
    });
    cal.appendChild(btn);
  }
}

function renderDetails(date) {
  const items = performances.filter(p => p.date === date);
  document.getElementById('detailDate').textContent = date;
  const title = document.getElementById('detailTitle');
  const meta = document.getElementById('meta');
  const songs = document.getElementById('songs');
  songs.innerHTML = '';

  if (!items.length) {
    title.textContent = '공연 기록이 없습니다.';
    meta.textContent = '다른 날짜를 선택해 주세요.';
    return;
  }

  title.textContent = items.length > 1 ? `${items.length} SHOWS` : items[0].title;
  items.forEach(p => {
    const info = document.createElement('div');
    info.className = 'meta';
    info.textContent = `${p.venue}  /  ${p.time}`;
    songs.appendChild(info);

    const head = document.createElement('div');
    head.className = 'setlist-head';
    head.innerHTML = '<span>SETLIST</span><span>TRACKS</span>';
    songs.appendChild(head);

    p.songs.forEach((song, i) => {
      const row = document.createElement('div');
      row.className = 'song';
      const num = document.createElement('span');
      num.className = 'song-num';
      num.textContent = String(i+1).padStart(2,'0');
      const name = document.createElement('span');
      name.textContent = song;
      row.append(num, name);
      songs.appendChild(row);
    });
  });
}

function searchSongs() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('results');
  results.innerHTML = '';
  if (!q) {
    results.textContent = '검색할 곡 제목을 입력해 주세요.';
    return;
  }

  const matches = performances.flatMap(p =>
    p.songs.filter(s => s.toLowerCase().includes(q))
      .map(s => ({...p, matchedSong: s}))
  );

  if (!matches.length) {
    results.textContent = '검색 결과가 없습니다.';
    return;
  }

  matches.forEach(p => {
    const item = document.createElement('div');
    item.className = 'result';
    const small = document.createElement('small');
    small.textContent = p.date + ' / ' + p.title;
    const name = document.createElement('div');
    name.textContent = p.matchedSong;
    item.append(small, name);
    item.addEventListener('click', () => {
      selectedDate = p.date;
      current = new Date(Number(p.date.slice(0,4)), Number(p.date.slice(5,7))-1, 1);
      renderCalendar();
      renderDetails(p.date);
      document.getElementById('details').scrollIntoView({behavior:'smooth'});
    });
    results.appendChild(item);
  });
}

document.getElementById('prev').addEventListener('click', () => {
  current.setMonth(current.getMonth()-1);
  renderCalendar();
});
document.getElementById('next').addEventListener('click', () => {
  current.setMonth(current.getMonth()+1);
  renderCalendar();
});
document.getElementById('searchBtn').addEventListener('click', searchSongs);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchSongs();
});

renderCalendar();
</script>
</body>
</html>
