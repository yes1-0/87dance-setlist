<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87DANCE ARCHIVE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root {
  --bg:#f7f7f5;
  --fg:#171717;
  --muted:#888;
  --line:#dededb;
  --soft:#ededeb;
}

* { box-sizing:border-box; }

html, body, button, select {
  touch-action: manipulation;
}

  /* 입력창 터치 시 자동 확대 방지 */
input,
textarea,
select {
  font-size: 16px !important;
}
  
body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'Noto Sans KR',sans-serif;
}

button,input { font:inherit; }
button { color:inherit; cursor:pointer; }

.page {
  max-width:1040px;
  margin:auto;
  padding:52px 34px 100px;
}

header {
  border-bottom:1px solid var(--fg);
  padding-bottom:22px;
}

.eyebrow,.mono {
  font-family:'DM Mono',monospace;
  letter-spacing:.02em;
}

.eyebrow {
  font-size:11px;
  color:var(--muted);
}

h1 {
  font-size:clamp(27px,6.2vw,68px);
  letter-spacing:-.07em;
  line-height:1;
  margin:17px 0 12px;
  font-weight:700;
  white-space:nowrap;
}

.search-area {
  padding:27px 0 22px;
}

.search-box {
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--fg);
  padding:10px 0;
}

.search-box input {
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
  color:var(--fg);
}

.search-box input::placeholder { color:#aaa; }

.search-box button {
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:34px 0 16px;
}

.section-head h2 {
  font-size:17px;
  margin:0;
  letter-spacing:-.04em;
}

.section-head span {
  font:11px 'DM Mono',monospace;
  color:var(--muted);
}

.calendar-wrap {
  border-top:1px solid var(--fg);
  padding-top:17px;
}

.calendar-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.month-label {
  display:flex;
  align-items:center;
  gap:3px;
  font:20px 'DM Mono',monospace;
}

.month-label select {
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--fg);
  font:inherit;
  padding:4px 2px;
  cursor:pointer;
  outline:none;
}

.month-label select:focus-visible {
  outline:1px solid var(--muted);
  outline-offset:2px;
}

.month-separator {
  color:var(--muted);
  pointer-events:none;
}

.month-nav {
  display:flex;
  gap:7px;
}

.month-nav button {
  border:1px solid var(--line);
  background:none;
  width:30px;
  height:30px;
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.weekday {
  text-align:center;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  padding:8px 0;
}

.day {
  min-width:0;
  min-height:78px;
  border:1px solid transparent;
  background:transparent;
  padding:8px 3px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  overflow:hidden;
}

.day:hover { background:var(--soft); }
.day.today { border-color:var(--line); }
.day.selected { background:var(--fg); color:white; }

.day-number {
  font:12px 'DM Mono',monospace;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.today-dot {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#171717;
  color:#fff;
  font:12px 'DM Mono',monospace;
  flex-shrink:0;
}

.calendar-event-names {
  display:flex;
  flex-direction:column;
  width:100%;
  gap:3px;
}

.calendar-event-name {
  display:block;
  width:100%;
  font-size:9px;
  line-height:1.3;
  font-weight:600;
  word-break:keep-all;
  overflow-wrap:anywhere;
  text-align:center;
}

.day.selected .calendar-event-name { color:white; }
/* 기념일 제목은 공연·일반 일정과 구분되는 회색 */
.calendar-event-name.anniversary { color:#999999; }
.day.selected .calendar-event-name.anniversary { color:#bdbdbd; }
.day.empty { pointer-events:none; }

.selected-area {
  margin-top:20px;
  border-top:1px solid var(--fg);
  padding-top:18px;
}

.selected-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.selected-date {
  font:14px 'DM Mono',monospace;
}

.selected-count {
  font-size:10px;
  color:var(--muted);
}

.event-card {
  padding:12px 0;
  display:grid;
  grid-template-columns:105px 1fr auto;
  gap:20px;
  align-items:center;
  cursor:pointer;
}

.event-card:hover .event-title { text-decoration:underline; }

.event-date {
  font:11px 'DM Mono',monospace;
  color:var(--muted);
}

.event-title {
  font-size:14px;
  font-weight:600;
}

.event-venue {
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.event-artist {
  font:10px 'DM Mono',monospace;
  border:1px solid var(--line);
  border-radius:20px;
  padding:5px 9px;
  white-space:nowrap;
}

.empty-message {
  color:var(--muted);
  font-size:12px;
  padding:22px 0;
}

.details {
  display:none;
  margin:18px 0 5px;
  padding:20px;
  background:#eeeeeb;
}

.details.open { display:block; }
.other-description { white-space:pre-wrap; font-size:12px; line-height:1.7; margin:0; }

.event-group .inline-details {
  margin:0 0 12px;
}

.details-top {
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:start;
  margin-bottom:17px;
}

.details-title {
  font-size:16px;
  font-weight:700;
}

.details-meta {
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}

.close-detail {
  border:0;
  background:none;
  font-size:18px;
}

.setlist-label {
  font:10px 'DM Mono',monospace;
  color:var(--muted);
  border-top:1px solid #d2d2ce;
  padding-top:15px;
  margin:16px 0 10px;
}

.song-list {
  list-style:none;
  padding:0;
  margin:0;
}

.song {
  display:flex;
  align-items:baseline;
  gap:12px;
  padding:5px 0;
  font-size:12px;
}

.song-number {
  width:20px;
  color:#999;
  font:10px 'DM Mono',monospace;
  flex-shrink:0;
}

.song-name { flex:1; }

.song-mark {
  font:9px 'DM Mono',monospace;
  color:#888;
}

.song.encore .song-name { font-weight:700; }
.song.collab .song-name { font-style:italic; }

.reopen-detail {
  display:none;
  margin-top:12px;
  padding:9px 13px;
  border:1px solid var(--line);
  background:transparent;
  font:10px 'DM Mono',monospace;
}

.reopen-detail:hover {
  background:var(--fg);
  color:white;
}

.search-results { margin-top:16px; }
.search-results:empty { display:none; }

.search-result-label {
  font:10px 'DM Mono',monospace;
  color:var(--muted);
  margin:20px 0 8px;
}

.search-highlight {
  color:#1769e0;
  font-weight:700;
}

.search-match {
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
}

footer {
  border-top:1px solid var(--fg);
  margin-top:60px;
  padding-top:16px;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
}

@media(max-width:600px) {
  .page { padding:30px 18px 70px; }

  h1 {
    font-size:clamp(24px,6vw,40px);
  }

  .day {
    min-height:70px;
    padding:7px 1px 5px;
    gap:5px;
  }

  .calendar-event-name {
    font-size:7px;
    line-height:1.2;
  }

  .event-card {
    grid-template-columns:72px 1fr auto;
    gap:10px;
  }

  .event-title { font-size:12px; }
  .event-venue { font-size:10px; }

  .event-artist {
    font-size:9px;
    padding:4px 7px;
  }

  .details { padding:15px; }
}
</style>
</head>

<header>

  <h1>87DANCE ARCHIVE</h1>

<section class="search-area">
  <div class="search-box">
    <span class="mono">⌕</span>
    <input id="searchInput" type="search" placeholder="공연명, 장소, 곡명 검색">
    <button id="clearSearch">CLEAR</button>
  </div>
  <div id="searchResults" class="search-results"></div>
</section>

<section>
  <div class="section-head">

  <div class="calendar-wrap">

        <span class="month-separator">.</span>

      </div>
      <div class="month-nav">
        <button id="prevMonth" aria-label="이전 달">←</button>
        <button id="nextMonth" aria-label="다음 달">→</button>
      </div>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <div class="selected-area" id="selectedArea">
    <div class="selected-heading">
      <div class="selected-date" id="selectedDate">날짜를 선택해주세요</div>
      <div class="selected-count" id="selectedCount"></div>
    </div>

    <div id="selectedEvents">
      <div class="empty-message">
        캘린더에서 날짜를 선택하면 공연·기념일·일정 정보가 표시됩니다.
      </div>
    </div>

    <div id="details" class="details"></div>

    <button id="reopenDetail" class="reopen-detail">
      VIEW SETLIST ↗
    </button>
  </div>
</section>

<footer>87DANCE ARCHIVE — 2026 @ㄴㅔ</footer>
</div>

// ----------------------------------
// 기본 설정
// ----------------------------------

const $ = id => document.getElementById(id);

const initialToday = new Date();
let currentMonth = new Date(initialToday.getFullYear(), initialToday.getMonth(), 1);
let selectedDate = "";
let selectedPerformanceIndex = null;
let selectedOtherItem = null;
let anniversaries = [];
let otherEvents = [];

function parsedSongs(event) {
  return event.songs.split("|").filter(Boolean).map(raw => {
    let type = "normal";
    let song = raw;

    if(raw.startsWith("!")) {
      type = "encore";
      song = raw.slice(1);
    }

    if(raw.startsWith("~")) {
      type = "collab";
      song = raw.slice(1);
    }

    return {song,type};
  });
}

function formatDate(date) {
  const [y,m,d] = date.split("-");
  return `${y}.${m}.${d}`;
}

function hideReopenButton() {
  $("reopenDetail").style.display = "none";
  $("reopenDetail").textContent = "VIEW SETLIST ↗";
}

// ----------------------------------
// 캘린더
// ----------------------------------

// 매년 반복 기념일은 등록한 날짜부터만 표시합니다.
// 예: 2026-11-07로 등록 시 2025년에는 표시되지 않고 2026년부터 매년 표시됩니다.
function anniversaryMatchesDate(item, date) {
  const itemDate = String(item.date || "");
  if(item.repeat === "yearly") {
    return date >= itemDate && itemDate.slice(5) === date.slice(5);
  }
  return itemDate === date;
}

function getNonPerformanceItems(date) {
  const dayAnniversaries = anniversaries
    .filter(item => anniversaryMatchesDate(item, date))
    .map(item => ({...item, _kind: "anniversary"}));
  const dayEvents = otherEvents
    .filter(item => item.date === date)
    .map(item => ({...item, _kind: "event"}));
  return [...dayAnniversaries, ...dayEvents];
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const todayDate = new Date();
  const todayString = `${todayDate.getFullYear()}-${String(todayDate.getMonth()+1).padStart(2,"0")}-${String(todayDate.getDate()).padStart(2,"0")}`;

  const years = new Set();

  performances.concat(anniversaries,otherEvents).forEach(p => {
    const y = Number(String(p.date).slice(0,4));
    if(Number.isFinite(y)) years.add(y);
  });

  for(let y = Math.min(2024, year); y <= Math.max(todayDate.getFullYear()+5, year); y++) {
    years.add(y);
  }

  const yearSelect = $("yearSelect");
  const monthSelect = $("monthSelect");

  yearSelect.innerHTML = [...years].sort((a,b)=>a-b)
    .map(y=>`<option value="${y}">${y}년</option>`).join("");

  monthSelect.innerHTML = Array.from({length:12},(_,i)=>
    `<option value="${i}">${i+1}월</option>`
  ).join("");

  yearSelect.value = String(year);
  monthSelect.value = String(month);

  yearSelect.onchange = () => {
    currentMonth = new Date(Number(yearSelect.value), currentMonth.getMonth(), 1);
    renderCalendar();
  };

  monthSelect.onchange = () => {
    currentMonth = new Date(currentMonth.getFullYear(), Number(monthSelect.value), 1);
    renderCalendar();
  };

  const first = new Date(year,month,1).getDay();
  const last = new Date(year,month+1,0).getDate();

  let html = [
    "SUN","MON","TUE","WED","THU","FRI","SAT"
  ].map(d=>`<div class="weekday">${d}</div>`).join("");

  for(let i=0;i<first;i++) {
    html += `<div class="day empty"></div>`;
  }

  for(let d=1;d<=last;d++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayEvents = performances.filter(p=>p.date===date);
    const otherDayItems = getNonPerformanceItems(date);
    const hasItems = dayEvents.length + otherDayItems.length > 0;
    const today = date===todayString;
    const selected = date===selectedDate;

    html += `
      <button class="day
        ${hasItems ? "has-event" : ""}
        ${today ? "today" : ""}
        ${selected ? "selected" : ""}"
        data-date="${date}">

        <span class="day-number">${today ? `<span class="today-dot" aria-label="오늘">${d}</span>` : d}</span>

        ${hasItems ? `
          <span class="calendar-event-names">
            ${dayEvents.map(p=>`<span class="calendar-event-name">${escapeHtml(p.title)}</span>`).join("")}
            ${otherDayItems.map(x=>`<span class="calendar-event-name${x._kind==='anniversary'?' anniversary':''}">${x._kind==='anniversary'?'✦ ':''}${escapeHtml(x.title)}</span>`).join("")}
          </span>
        ` : ""}

      </button>
    `;
  }

  $("calendar").innerHTML = html;

  document.querySelectorAll(".day[data-date]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedDate = btn.dataset.date;
      selectedPerformanceIndex = null;
      selectedOtherItem = null;
      renderCalendar();
      renderSelectedEvents();
    });
  });
}

// ----------------------------------
// 날짜별 공연 정보
// ----------------------------------

// 상세 정보와 다시 열기 버튼을 선택한 카드 바로 아래로 옮깁니다.
function mountDetailsAfterCard(card) {
  if (!card) return;
  card.after($("details"), $("reopenDetail"));
}

// 날짜 목록을 다시 그리기 전에 상세 요소를 목록 밖으로 옮겨
// innerHTML 교체 시 상세 요소가 사라지는 일을 방지합니다.
function restoreDetailsPlacement() {
  $("selectedArea").append($("details"), $("reopenDetail"));
}

function findOtherCard(item) {
  const index = getNonPerformanceItems(selectedDate).findIndex(candidate =>
    candidate._kind === item._kind &&
    candidate.date === item.date &&
    candidate.title === item.title &&
    candidate.repeat === item.repeat &&
    candidate.venue === item.venue &&
    candidate.description === item.description
  );
  return index < 0 ? null : $("selectedEvents").querySelector(`[data-other-index="${index}"]`);
}

function renderSelectedEvents() {
  restoreDetailsPlacement();
  if(!selectedDate) {
    $("selectedDate").textContent = "날짜를 선택해주세요";
    $("selectedCount").textContent = "";
    return;
  }

  const livePerformances = performances
    .map((performance, index) => ({performance, index}))
    .filter(({performance}) => performance.date === selectedDate);
  const otherOnDate = getNonPerformanceItems(selectedDate);
  const total = livePerformances.length + otherOnDate.length;

  $("selectedDate").textContent = formatDate(selectedDate);
  $("selectedCount").textContent = `${total} ITEMS`;

  if(!total) {
    $("selectedEvents").innerHTML = '<div class="empty-message">등록된 일정이 없습니다.</div>';
    $("details").classList.remove("open");
    selectedOtherItem = null;
    hideReopenButton();
    return;
  }

  const performanceCards = livePerformances.map(({performance, index}) => `
    <div class="event-card" data-index="${index}">
      <div class="event-date">공연</div>
      <div>
        <div class="event-title">${escapeHtml(performance.title)}</div>
        <div class="event-venue">${escapeHtml(performance.venue)}</div>
      </div>
      <div class="event-artist">${escapeHtml(performance.artist)}</div>
    </div>
  `).join("");

  const extraCards = otherOnDate.map((item, index) => `
    <div class="event-card" data-other-index="${index}">
      <div class="event-date">${item._kind === 'anniversary' ? '기념일' : '일정'}</div>
      <div>
        <div class="event-title">${escapeHtml(item.title)}</div>
        <div class="event-venue">${escapeHtml(item.venue || item.description || '')}</div>
      </div>
      <div class="event-artist">${item._kind === 'anniversary' ? (item.repeat === 'yearly' ? '매년 반복' : '기념일') : 'EVENT'}</div>
    </div>
  `).join("");

  $("selectedEvents").innerHTML = performanceCards + extraCards;

  document.querySelectorAll("#selectedEvents [data-index]").forEach(card => {
    card.addEventListener("click", () => renderDetails(Number(card.dataset.index)));
  });
  document.querySelectorAll("#selectedEvents [data-other-index]").forEach(card => {
    card.addEventListener("click", () => renderOtherDetails(otherOnDate[Number(card.dataset.otherIndex)], card));
  });

  if(total === 1 && livePerformances.length === 1) {
    renderDetails(livePerformances[0].index);
  } else if(total === 1 && otherOnDate.length === 1) {
    renderOtherDetails(otherOnDate[0], $("selectedEvents").querySelector('[data-other-index="0"]'));
  } else {
    $("details").classList.remove("open");
    selectedOtherItem = null;
    hideReopenButton();
  }
}

function renderOtherDetails(item, card = null) {
  if(!item) return;
  mountDetailsAfterCard(card || findOtherCard(item));
  selectedPerformanceIndex = null;
  selectedOtherItem = item;
  const kindLabel = item._kind === 'anniversary' ? '기념일' : '일반 일정';
  const repeatLabel = item._kind === 'anniversary'
    ? (item.repeat === 'yearly' ? ' · 매년 반복' : ' · 해당 연도만')
    : '';
  const placeLabel = item.venue ? ` · ${escapeHtml(item.venue)}` : '';

  $("details").innerHTML = `
    <div class="details-top">
      <div>
        <div class="details-title">${escapeHtml(item.title)}</div>
        <div class="details-meta">${kindLabel}${repeatLabel}${placeLabel}</div>
      </div>

}

// ----------------------------------
// 검색 공통 함수
// ----------------------------------

function normalizeSearch(value) {
  return String(value ?? "")
    .toLowerCase()
    .replace(/[\s\-_.()[\]{}'"’‘,:!&×+]/g, "");
}

// 로컬 별칭과 클라우드 별칭을 합쳐서 사용합니다.
function mergeAliasMaps(base = {}, incoming = {}) {
  const merged = {};

  function addAliases(source) {
    Object.entries(source || {}).forEach(([key, aliases]) => {
      const existingKey = Object.keys(merged).find(
        k => normalizeSearch(k) === normalizeSearch(key)
      );

      const targetKey = existingKey || key;
      const current = Array.isArray(merged[targetKey])
        ? merged[targetKey]
        : [];

      const incomingAliases = Array.isArray(aliases)
        ? aliases
        : [];

      const combined = [...current, ...incomingAliases];

      merged[targetKey] = [
        ...new Map(
          combined.map(alias => [normalizeSearch(alias), alias])
        ).values()
      ];
    });
  }

  addAliases(base);
  addAliases(incoming);

  return merged;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function highlightText(value, query) {
  const safe = escapeHtml(value);
  const q = String(query ?? "").trim();
  if(!q) return safe;

  const escapedQuery = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  try {
    return safe.replace(
      new RegExp(`(${escapedQuery})`, "ig"),
      '<span class="search-highlight">$1</span>'
    );
  } catch {
    return safe;
  }
}

function getAliasesForSong(song) {
  const normalizedSong = normalizeSearch(song);

  return Object.entries(songAliases)
    .filter(([canonical]) => {
      const key = normalizeSearch(canonical);
      return key && (
        normalizedSong.includes(key) ||
        key.includes(normalizedSong)
      );
    })
    .flatMap(([, aliases]) => aliases);
}

function matchesAliasInText(value, query) {
  const normalizedValue = normalizeSearch(value);
  const normalizedQuery = normalizeSearch(query);

  if(!normalizedValue || !normalizedQuery) return false;

  return Object.entries(songAliases).some(([canonical, aliases]) => {
    const canonicalKey = normalizeSearch(canonical);

    const canonicalAppears =
      normalizedValue.includes(canonicalKey) ||
      canonicalKey.includes(normalizedValue);

    return canonicalAppears &&
      aliases.some(alias =>
        normalizeSearch(alias).includes(normalizedQuery)
      );
  });
}

function getSongMatches(performance, query) {
  const normalizedQuery = normalizeSearch(query);
  if(!normalizedQuery) return [];

  return parsedSongs(performance).filter(({song}) => {
    const normalizedSong = normalizeSearch(song);
    const aliases = getAliasesForSong(song);

    return normalizedSong.includes(normalizedQuery) ||
      aliases.some(alias =>
        normalizeSearch(alias).includes(normalizedQuery)
      );
  }).map(({song,type}) => ({
    song,
    type,
    matchedAliases: getAliasesForSong(song).filter(alias =>
      normalizeSearch(alias).includes(normalizedQuery)
    )
  }));
}

function matchesEventAliasInText(value, query) {
  const normalizedValue = normalizeSearch(value);
  const normalizedQuery = normalizeSearch(query);

  if(!normalizedValue || !normalizedQuery) return false;

  return Object.entries(eventAliases).some(([canonical, aliases]) => {
    const canonicalKey = normalizeSearch(canonical);

    const canonicalAppears =
      normalizedValue.includes(canonicalKey) ||
      canonicalKey.includes(normalizedValue);

    return canonicalAppears &&
      aliases.some(alias =>
        normalizeSearch(alias).includes(normalizedQuery)
      );
  });
}

// ----------------------------------
// 검색 결과 표시
// ----------------------------------

function renderSearch() {
  const query = $("searchInput").value.trim();

  if(!query) {
    $("searchResults").innerHTML = "";
    return;
  }

  const normalizedQuery = normalizeSearch(query);

  const results = performances.map((performance,index)=>{
    const directFields = [
      performance.title,
      performance.venue,
      performance.artist
    ];

    const directMatch = directFields.some(value =>
      normalizeSearch(value).includes(normalizedQuery) ||
      matchesAliasInText(value,query) ||
      matchesEventAliasInText(value,query)
    );

    const matchedSongs = getSongMatches(performance,query);

    return {
      performance,
      index,
      directMatch,
      matchedSongs
    };
  }).filter(result =>
    result.directMatch || result.matchedSongs.length
  );

  // 공연 검색 외에도 기념일/일반 일정 제목·장소·설명을 검색합니다.
  const extraResults = [
    ...anniversaries.map((item,index) => ({item,index,kind:'anniversary'})),
    ...otherEvents.map((item,index) => ({item,index,kind:'event'}))
  ].filter(({item}) => [item.title, item.venue, item.description].some(value =>
    normalizeSearch(value).includes(normalizedQuery) ||
    matchesEventAliasInText(value, query)
  ));

  $("searchResults").innerHTML = `
    <div class="search-result-label">
      SEARCH RESULTS — ${results.length + extraResults.length}
    </div>

    ${results.map(({performance,index,matchedSongs})=>`
      <div class="event-card search-event-card" data-index="${index}">
        <div class="event-date">${formatDate(performance.date)}</div>
        <div>
          <div class="event-title">${highlightText(performance.title,query)}</div>
          <div class="event-venue">${highlightText(performance.venue,query)}</div>
          ${matchedSongs.length ? `
            <div class="search-match">
              ${matchedSongs.map(match=>
                `<span class="search-highlight">${escapeHtml(match.song)}</span>`
              ).join(" · ")}
            </div>
          ` : ""}
        </div>
        <div class="event-artist">${escapeHtml(performance.artist)}</div>
      </div>
    `).join("")}

    ${extraResults.map(({item,index,kind})=>`
      <div class="event-card extra-search-card" data-kind="${kind}" data-extra-index="${index}">
        <div class="event-date">${kind === 'anniversary' && item.repeat === 'yearly' ? '매년 ' + escapeHtml(String(item.date).slice(5).replace('-', '.')) : formatDate(item.date)}</div>
        <div>
          <div class="event-title">${highlightText(item.title,query)}</div>
          <div class="event-venue">${highlightText(item.venue || item.description || '',query)}</div>
        </div>
        <div class="event-artist">${kind === 'anniversary' ? '기념일' : '일정'}</div>
      </div>
    `).join("")}

    ${!results.length && !extraResults.length ? '<div class="empty-message">검색 결과가 없습니다.</div>' : ''}
  `;

  document.querySelectorAll(".search-event-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const index = Number(card.dataset.index);
      const performance = performances[index];
      currentMonth = new Date(
        Number(performance.date.slice(0,4)),
        Number(performance.date.slice(5,7))-1,
        1
      );
      selectedDate = performance.date;
      renderCalendar();
      renderSelectedEvents();
      renderDetails(index);
      $("selectedArea").scrollIntoView({behavior:"smooth",block:"start"});
    });
  });

  document.querySelectorAll(".extra-search-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const kind = card.dataset.kind;
      const raw = kind === 'anniversary'
        ? anniversaries[Number(card.dataset.extraIndex)]
        : otherEvents[Number(card.dataset.extraIndex)];
      if(!raw) return;

      // 검색에서도 등록 연도 이전으로 이동하지 않습니다.
      // 등록 연도 이후라면 선택 중인 연도의 같은 기념일로 이동합니다.
      let targetDate = raw.date;
      if(kind === 'anniversary' && raw.repeat === 'yearly' &&
         currentMonth.getFullYear() >= Number(raw.date.slice(0,4))) {
        const yearDate = `${currentMonth.getFullYear()}${raw.date.slice(4)}`;
        const candidate = new Date(`${yearDate}T12:00:00`);
        if(!Number.isNaN(candidate.getTime()) &&
           candidate.getFullYear() === currentMonth.getFullYear() &&
           candidate.getMonth()+1 === Number(raw.date.slice(5,7)) &&
           candidate.getDate() === Number(raw.date.slice(8,10))) {
          targetDate = yearDate;
        }
      }

      currentMonth = new Date(Number(targetDate.slice(0,4)), Number(targetDate.slice(5,7))-1, 1);
      selectedDate = targetDate;
      renderCalendar();
      renderSelectedEvents();
      renderOtherDetails({...raw,_kind:kind});
      $("selectedArea").scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}

    currentMonth.getMonth()-1,

});

    currentMonth.getMonth()+1,

});
