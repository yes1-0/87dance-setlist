:root {
  --bg:#f7f7f5; --fg:#171717; --muted:#888;
  --line:#dededb; --soft:#ededeb;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'Noto Sans KR',sans-serif;
}
button,input { font:inherit; }
button { color:inherit; }
.page { max-width:1040px; margin:auto; padding:52px 34px 100px; }
header { border-bottom:1px solid var(--fg); padding-bottom:22px; }
.eyebrow,.mono,.date,.count,.tag {
  font-family:'DM Mono',monospace;
  letter-spacing:.02em;
}
.eyebrow { font-size:11px; color:var(--muted); }
h1 {
  font-size:clamp(36px,7vw,68px); letter-spacing:-.07em;
  line-height:1; margin:17px 0 12px; font-weight:700;
}
.subtitle { font-size:12px; color:var(--muted); }
.stats {
  display:flex; gap:35px; padding:22px 0 26px;
  border-bottom:1px solid var(--line);
}
.stat strong { display:block; font:24px 'DM Mono',monospace; }
.stat span { color:var(--muted); font-size:10px; }
.search-area { padding:27px 0 22px; }
.search-box {
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--fg); padding:10px 0;
}
.search-box input {
  flex:1; border:0; outline:0; background:transparent;
  font-size:14px; color:var(--fg);
}
.search-box input::placeholder { color:#aaa; }
.search-box button {
  border:0; background:none; cursor:pointer; color:var(--muted);
  font-size:11px;
}
.filters {
  display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;
}
.filter {
  border:1px solid var(--line); border-radius:30px;
  background:transparent; padding:7px 14px;
  font-size:11px; cursor:pointer;
}
.filter.active { background:var(--fg); color:white; border-color:var(--fg); }
.section-head {
  display:flex; justify-content:space-between; align-items:end;
  margin:34px 0 16px;
}
.section-head h2 { font-size:17px; margin:0; letter-spacing:-.04em; }
.section-head span { font:11px 'DM Mono',monospace; color:var(--muted); }
.calendar-wrap { border-top:1px solid var(--fg); padding-top:17px; }
.calendar-top {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px;
}
.month-label { font:20px 'DM Mono',monospace; }
.month-nav { display:flex; gap:7px; }
.month-nav button {
  border:1px solid var(--line); background:none; width:30px; height:30px;
  cursor:pointer;
}
.calendar {
  display:grid; grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.weekday {
  text-align:center; color:var(--muted); font:10px 'DM Mono',monospace;
  padding:8px 0;
}
.day {
  position:relative; min-height:62px; border:1px solid transparent;
  background:transparent; cursor:pointer; text-align:center;
  padding:9px 2px 6px; font:12px 'DM Mono',monospace;
}
.day:hover { background:var(--soft); }
.day.muted { color:#c5c5c2; }
.day.today { border-color:var(--line); }
.day.selected { background:var(--fg); color:white; }
.day.has-event::after {
  content:""; position:absolute; width:4px; height:4px;
  border-radius:50%; background:currentColor; bottom:7px; left:calc(50% - 2px);
}
.day.selected.has-event::after { background:white; }
.day.empty { pointer-events:none; }
.selected-area {
  margin-top:20px; border-top:1px solid var(--fg); padding-top:18px;
}
.selected-heading {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:15px;
}
.selected-date { font:14px 'DM Mono',monospace; }
.selected-count { font-size:10px; color:var(--muted); }
.event-card {
  padding:14px 0; display:grid;
  grid-template-columns:105px 1fr auto; gap:20px;
  align-items:center; cursor:pointer;
}
.event-card:hover .event-title { text-decoration:underline; }
.event-date { font:11px 'DM Mono',monospace; color:var(--muted); }
.event-title { font-size:14px; font-weight:600; }
.event-venue { font-size:11px; color:var(--muted); margin-top:5px; }
.event-artist {
  font:10px 'DM Mono',monospace; border:1px solid var(--line);
  border-radius:20px; padding:5px 9px; white-space:nowrap;
}
.empty-message { color:var(--muted); font-size:12px; padding:22px 0; }
.details {
  display:none; margin:18px 0 5px; padding:20px;
  background:#eeeeeb;
}
.details.open { display:block; }
.details-top {
  display:flex; justify-content:space-between; gap:15px;
  align-items:start; margin-bottom:17px;
}
.details-title { font-size:16px; font-weight:700; }
.details-meta { font-size:11px; color:var(--muted); margin-top:6px; }
.close-detail {
  border:0; background:none; cursor:pointer; font-size:18px;
}
.setlist-label {
  font:10px 'DM Mono',monospace; color:var(--muted);
  border-top:1px solid #d2d2ce; padding-top:15px; margin:16px 0 10px;
}
.song-list { list-style:none; padding:0; margin:0; }
.song {
  display:flex; align-items:baseline; gap:12px;
  padding:5px 0; font-size:12px;
}
.song-number { width:20px; color:#999; font:10px 'DM Mono',monospace; }
.song-name { flex:1; }
.song-mark { font:9px 'DM Mono',monospace; color:#888; }
.song.encore .song-name { font-weight:700; }
.song.collab .song-name { font-style:italic; }
.search-results { margin-top:16px; }
.search-results:empty { display:none; }
.search-result-label {
  font:10px 'DM Mono',monospace; color:var(--muted);
  margin:20px 0 8px;
}
footer {
  border-top:1px solid var(--fg); margin-top:60px;
  padding-top:16px; color:var(--muted); font:10px 'DM Mono',monospace;
}
@media(max-width:600px) {
  .page { padding:30px 18px 70px; }
  .stats { gap:22px; }
  .day { min-height:51px; }
  .event-card { grid-template-columns:72px 1fr auto; gap:10px; }
  .event-title { font-size:12px; }
  .event-venue { font-size:10px; }
  .event-artist { font-size:9px; padding:4px 7px; }
  .details { padding:15px; }
}
</style>

const $ = id => document.getElementById(id);
let currentMonth = new Date(2026, 0, 1);
let selectedDate = "";
let selectedArtist = "ALL";

function parsedSongs(event) {
  return event.songs.split("|").filter(Boolean).map(raw => {
    let type = "normal";
    let song = raw;
    if (song.startsWith("!")) { type = "encore"; song = song.slice(1); }
    if (song.startsWith("~")) { type = "collab"; song = song.slice(1); }
    return {song, type};
  });
}
function filteredEvents() {
  return performances.filter(p =>
    selectedArtist === "ALL" || p.artist === selectedArtist
  );
}
function formatDate(date) {
  const [y,m,d] = date.split("-");
  return `${y}.${m}.${d}`;
}
function renderStats() {
  const list = filteredEvents();
  $("totalEvents").textContent = list.length;
  $("totalSongs").textContent = list.reduce((sum,p)=>sum+parsedSongs(p).length,0);
}
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  $("monthLabel").textContent =
    `${year}.${String(month+1).padStart(2,"0")}`;
  const first = new Date(year,month,1).getDay();
  const last = new Date(year,month+1,0).getDate();
  const events = filteredEvents();
  let html = ["SUN","MON","TUE","WED","THU","FRI","SAT"]
    .map(d=>`<div class="weekday">${d}</div>`).join("");
  for(let i=0;i<first;i++) html += `<div class="day empty"></div>`;
  for(let d=1;d<=last;d++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const has = events.some(p=>p.date===date);
    const today = date==="2026-11-05";
    const selected = date===selectedDate;
    html += `<button class="day ${has?"has-event":""} ${today?"today":""} ${selected?"selected":""}" data-date="${date}">${d}</button>`;
  }
  $("calendar").innerHTML = html;
  document.querySelectorAll(".day[data-date]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedDate=btn.dataset.date;
      renderCalendar();
      renderSelectedEvents();
    });
  });
}
function renderSelectedEvents() {
  if(!selectedDate) {
    $("selectedDate").textContent="날짜를 선택해주세요";
    $("selectedCount").textContent="";
    $("selectedEvents").innerHTML='<div class="empty-message">캘린더에서 공연 날짜를 선택하면 공연 정보가 표시됩니다.</div>';
    $("details").classList.remove("open");
    return;
  }
  const list=filteredEvents().filter(p=>p.date===selectedDate);
  $("selectedDate").textContent=formatDate(selectedDate);
  $("selectedCount").textContent=`${list.length} PERFORMANCE${list.length===1?"":"S"}`;
  $("selectedEvents").innerHTML=list.length ? list.map((p,i)=>`
    <div class="event-card" data-index="${performances.indexOf(p)}">
      <div class="event-date">${p.artist}</div>
      <div>
        <div class="event-title">${p.title}</div>
        <div class="event-venue">${p.venue}</div>
      </div>
      <div class="event-artist">VIEW ↗</div>
    </div>`).join("") :
    '<div class="empty-message">선택한 날짜에는 등록된 공연이 없습니다.</div>';
  $("details").classList.remove("open");
  document.querySelectorAll(".event-card").forEach(card=>{
    card.addEventListener("click",()=>renderDetails(Number(card.dataset.index)));
  });
}
function renderDetails(index) {
  const p=performances[index];
  const songs=parsedSongs(p);
  const normal=songs.filter(s=>s.type==="normal");
  const encore=songs.filter(s=>s.type==="encore");
  const collab=songs.filter(s=>s.type==="collab");
  function songRows(items) {
    return `<ol class="song-list">${items.map((s,i)=>`
      <li class="song ${s.type}">
        <span class="song-number">${String(i+1).padStart(2,"0")}</span>
        <span class="song-name">${s.song}</span>
        ${s.type==="encore"?'<span class="song-mark">ENCORE</span>':""}
        ${s.type==="collab"?'<span class="song-mark">COLLAB</span>':""}
      </li>`).join("")}</ol>`;
  }
  let html=`
    <div class="details-top">
      <div>
        <div class="details-title">${p.title}</div>
        <div class="details-meta">${formatDate(p.date)}　/　${p.venue}　/　${p.artist}</div>
      </div>
      <button class="close-detail" id="closeDetail">×</button>
    </div>`;
  if(normal.length) html+=`<div class="setlist-label">SETLIST — ${normal.length} TRACKS</div>${songRows(normal)}`;
  if(encore.length) html+=`<div class="setlist-label">ENCORE — ${encore.length} TRACKS</div>${songRows(encore)}`;
  if(collab.length) html+=`<div class="setlist-label">COLLABORATION / GUEST — ${collab.length} TRACKS</div>${songRows(collab)}`;
  $("details").innerHTML=html;
  $("details").classList.add("open");
  $("closeDetail").addEventListener("click",()=>$("details").classList.remove("open"));
  $("details").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function renderSearch() {
  const q=$("searchInput").value.trim().toLowerCase();
  if(!q) { $("searchResults").innerHTML=""; return; }
  const results=filteredEvents().filter(p=>{
    const text=[p.title,p.venue,p.artist,...parsedSongs(p).map(s=>s.song)].join(" ").toLowerCase();
    return text.includes(q);
  });
  $("searchResults").innerHTML=`
    <div class="search-result-label">SEARCH RESULTS — ${results.length}</div>
    ${results.length?results.map(p=>`
      <div class="event-card" data-index="${performances.indexOf(p)}">
        <div class="event-date">${formatDate(p.date)}</div>
        <div>
          <div class="event-title">${p.title}</div>
          <div class="event-venue">${p.venue} · ${p.artist}</div>
        </div>
        <div class="event-artist">VIEW ↗</div>
      </div>`).join(""):'<div class="empty-message">검색 결과가 없습니다.</div>'}`;
  document.querySelectorAll("#searchResults .event-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const p=performances[Number(card.dataset.index)];
      selectedDate=p.date;
      currentMonth=new Date(Number(p.date.slice(0,4)),Number(p.date.slice(5,7))-1,1);
      renderCalendar();
      renderSelectedEvents();
      renderDetails(Number(card.dataset.index));
      $("selectedArea").scrollIntoView({behavior:"smooth"});
    });
  });
}
function renderAll() {
  renderStats();
  renderCalendar();
  renderSelectedEvents();
  renderSearch();
}
$("prevMonth").addEventListener("click",()=>{
  currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  renderCalendar();
});
$("nextMonth").addEventListener("click",()=>{
  currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,1);
  renderCalendar();
});
$("searchInput").addEventListener("input",renderSearch);
$("clearSearch").addEventListener("click",()=>{
  $("searchInput").value="";
  renderSearch();
});
document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedArtist=btn.dataset.artist;
    document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===btn));
    renderAll();
  });
});
renderAll();
</script>
