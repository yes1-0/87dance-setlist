
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87dance setlist</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root {
  --bg:#f7f7f5;
  --fg:#171717;
  --muted:#888;
  --line:#dededb;
  --soft:#ededeb;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'Noto Sans KR',sans-serif;
}

button,input { font:inherit; }
button { color:inherit; cursor:pointer; }

.page {
  max-width:1040px;
  margin:auto;
  padding:52px 34px 100px;
}

header {
  border-bottom:1px solid var(--fg);
  padding-bottom:22px;
}

.eyebrow,.mono {
  font-family:'DM Mono',monospace;
  letter-spacing:.02em;
}

.eyebrow {
  font-size:11px;
  color:var(--muted);
}

h1 {
  font-size:clamp(36px,7vw,68px);
  letter-spacing:-.07em;
  line-height:1;
  margin:17px 0 12px;
  font-weight:700;
  white-space:nowrap;
}

/* 검색 */

.search-area {
  padding:27px 0 22px;
}

.search-box {
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--fg);
  padding:10px 0;
}

.search-box input {
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
  color:var(--fg);
}

.search-box input::placeholder { color:#aaa; }

.search-box button {
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

/* 섹션 제목 */

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:34px 0 16px;
}

.section-head h2 {
  font-size:17px;
  margin:0;
  letter-spacing:-.04em;
}

.section-head span {
  font:11px 'DM Mono',monospace;
  color:var(--muted);
}

/* 캘린더 */

.calendar-wrap {
  border-top:1px solid var(--fg);
  padding-top:17px;
}

.calendar-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.month-label {
  font:20px 'DM Mono',monospace;
}

.month-nav {
  display:flex;
  gap:7px;
}

.month-nav button {
  border:1px solid var(--line);
  background:none;
  width:30px;
  height:30px;
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.weekday {
  text-align:center;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  padding:8px 0;
}

.day {
  min-width:0;
  min-height:78px;
  border:1px solid transparent;
  background:transparent;
  padding:8px 3px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  overflow:hidden;
}

.day:hover { background:var(--soft); }
.day.today { border-color:var(--line); }
.day.selected { background:var(--fg); color:white; }

.day-number {
  font:12px 'DM Mono',monospace;
  flex-shrink:0;
}

.calendar-event-names {
  display:flex;
  flex-direction:column;
  width:100%;
  gap:3px;
}

.calendar-event-name {
  display:block;
  width:100%;
  font-size:9px;
  line-height:1.3;
  font-weight:600;
  word-break:keep-all;
  overflow-wrap:anywhere;
  text-align:center;
}

.day.selected .calendar-event-name { color:white; }
.day.empty { pointer-events:none; }

/* 날짜별 공연 정보 */

.selected-area {
  margin-top:20px;
  border-top:1px solid var(--fg);
  padding-top:18px;
}

.selected-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.selected-date {
  font:14px 'DM Mono',monospace;
}

.selected-count {
  font-size:10px;
  color:var(--muted);
}

.event-card {
  padding:12px 0;
  display:grid;
  grid-template-columns:105px 1fr auto;
  gap:20px;
  align-items:center;
  cursor:pointer;
}

.event-card:hover .event-title { text-decoration:underline; }

.event-date {
  font:11px 'DM Mono',monospace;
  color:var(--muted);
}

.event-title {
  font-size:14px;
  font-weight:600;
}

.event-venue {
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.event-artist {
  font:10px 'DM Mono',monospace;
  border:1px solid var(--line);
  border-radius:20px;
  padding:5px 9px;
  white-space:nowrap;
}

.empty-message {
  color:var(--muted);
  font-size:12px;
  padding:22px 0;
}

/* 셋리스트 */

.details {
  display:none;
  margin:18px 0 5px;
  padding:20px;
  background:#eeeeeb;
}

.details.open { display:block; }

.event-group .inline-details {
  margin:0 0 12px;
}

.details-top {
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:start;
  margin-bottom:17px;
}

.details-title {
  font-size:16px;
  font-weight:700;
}

.details-meta {
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}

.close-detail {
  border:0;
  background:none;
  font-size:18px;
}

.setlist-label {
  font:10px 'DM Mono',monospace;
  color:var(--muted);
  border-top:1px solid #d2d2ce;
  padding-top:15px;
  margin:16px 0 10px;
}

.song-list {
  list-style:none;
  padding:0;
  margin:0;
}

.song {
  display:flex;
  align-items:baseline;
  gap:12px;
  padding:5px 0;
  font-size:12px;
}

.song-number {
  width:20px;
  color:#999;
  font:10px 'DM Mono',monospace;
  flex-shrink:0;
}

.song-name { flex:1; }

.song-mark {
  font:9px 'DM Mono',monospace;
  color:#888;
}

.song.encore .song-name { font-weight:700; }
.song.collab .song-name { font-style:italic; }

.reopen-detail {
  display:none;
  margin-top:12px;
  padding:9px 13px;
  border:1px solid var(--line);
  background:transparent;
  font:10px 'DM Mono',monospace;
}

.reopen-detail:hover {
  background:var(--fg);
  color:white;
}

/* 검색 결과 */

.search-results { margin-top:16px; }
.search-results:empty { display:none; }

.search-result-label {
  font:10px 'DM Mono',monospace;
  color:var(--muted);
  margin:20px 0 8px;
}

.search-highlight {
  color:#1769e0;
  font-weight:700;
}

.search-match {
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
}

/* 하단 */

footer {
  border-top:1px solid var(--fg);
  margin-top:60px;
  padding-top:16px;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
}

/* 모바일 */

@media(max-width:600px) {
  .page { padding:30px 18px 70px; }

  h1 {
    font-size:clamp(30px,8vw,46px);
  }

  .day {
    min-height:70px;
    padding:7px 1px 5px;
    gap:5px;
  }

  .calendar-event-name {
    font-size:7px;
    line-height:1.2;
  }

  .event-card {
    grid-template-columns:72px 1fr auto;
    gap:10px;
  }

  .event-title { font-size:12px; }
  .event-venue { font-size:10px; }

  .event-artist {
    font-size:9px;
    padding:4px 7px;
  }

  .details { padding:15px; }
}
</style>
</head>

</div>

// ----------------------------------
// 기본 설정
// ----------------------------------

const $ = id => document.getElementById(id);

let currentMonth = new Date(2026,0,1);
let selectedDate = "";
let selectedPerformanceIndex = null;

function parsedSongs(event) {
  return event.songs.split("|").filter(Boolean).map(raw => {
    let type = "normal";
    let song = raw;

    if(song.startsWith("!")) {
      type = "encore";
      song = song.slice(1);
    }

    if(song.startsWith("~")) {
      type = "collab";
      song = song.slice(1);
    }

    return {song,type};
  });
}

function formatDate(date) {
  const [y,m,d] = date.split("-");
  return `${y}.${m}.${d}`;
}

function hideReopenButton() {
  $("reopenDetail").style.display = "none";
}

// ----------------------------------
// 캘린더
// ----------------------------------

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  $("monthLabel").textContent =
    `${year}.${String(month+1).padStart(2,"0")}`;

  const first = new Date(year,month,1).getDay();
  const last = new Date(year,month+1,0).getDate();

  let html = [
    "SUN","MON","TUE","WED","THU","FRI","SAT"
  ].map(d=>`<div class="weekday">${d}</div>`).join("");

  for(let i=0;i<first;i++) {
    html += `<div class="day empty"></div>`;
  }

  for(let d=1;d<=last;d++) {
    const date =
      `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    const dayEvents = performances.filter(p=>p.date===date);
    const today = date==="2026-11-05";
    const selected = date===selectedDate;

    html += `
      <button class="day
        ${dayEvents.length ? "has-event" : ""}
        ${today ? "today" : ""}
        ${selected ? "selected" : ""}"
        data-date="${date}">

        <span class="day-number">${d}</span>

        ${dayEvents.length ? `
          <span class="calendar-event-names">
            ${dayEvents.map(p=>`
              <span class="calendar-event-name">${p.title}</span>
            `).join("")}
          </span>
        ` : ""}

      </button>
    `;
  }

  $("calendar").innerHTML = html;

  document.querySelectorAll(".day[data-date]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedDate = btn.dataset.date;
      selectedPerformanceIndex = null;
      renderCalendar();
      renderSelectedEvents();
    });
  });
}

// ----------------------------------
// 날짜별 공연 정보
// ----------------------------------

function renderSelectedEvents() {
  if(!selectedDate) {
    $("selectedDate").textContent = "날짜를 선택해주세요";
    $("selectedCount").textContent = "";

    $("selectedEvents").innerHTML = `
      <div class="empty-message">
        캘린더에서 공연 날짜를 선택하면 공연 정보가 표시됩니다.
      </div>
    `;

    $("details").classList.remove("open");
    hideReopenButton();
    selectedPerformanceIndex = null;
    return;
  }

  const list = performances.filter(p=>p.date===selectedDate);

  $("selectedDate").textContent = formatDate(selectedDate);
  $("selectedCount").textContent =
    `${list.length} PERFORMANCE${list.length===1?"":"S"}`;

  if(!list.length) {
    $("selectedEvents").innerHTML = `
      <div class="empty-message">
        선택한 날짜에는 등록된 공연이 없습니다.
      </div>
    `;

    $("details").classList.remove("open");
    hideReopenButton();
    selectedPerformanceIndex = null;
    return;
  }

  if(list.length===1) {
    const index = performances.indexOf(list[0]);

    $("selectedEvents").innerHTML = `
      <div class="event-card">
        <div class="event-date">${formatDate(list[0].date)}</div>
        <div>
          <div class="event-title">${list[0].title}</div>
          <div class="event-venue">${list[0].venue}</div>
        </div>
        <div class="event-artist">${list[0].artist}</div>
      </div>
    `;

    renderDetails(index);
    return;
  }

  $("details").classList.remove("open");
  hideReopenButton();
  selectedPerformanceIndex = null;

  $("selectedEvents").innerHTML = list.map(p=>{
    const index = performances.indexOf(p);
    return `
      <div class="event-group">
        <div class="event-card" data-index="${index}">
          <div class="event-date">${formatDate(p.date)}</div>
          <div>
            <div class="event-title">${p.title}</div>
            <div class="event-venue">${p.venue}</div>
          </div>
          <div class="event-artist">VIEW ↗</div>
        </div>
        <div class="details inline-details" id="details-${index}"></div>
      </div>
    `;
  }).join("");

  document.querySelectorAll("#selectedEvents .event-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const index = Number(card.dataset.index);
      const target = document.getElementById(`details-${index}`);

      if(target.classList.contains("open")) {
        target.classList.remove("open");
        return;
      }

      renderDetails(index, `details-${index}`);
    });
  });
}

// ----------------------------------
// 셋리스트 상세 표시
// ----------------------------------

function renderDetails(index, targetId=null) {
  const p = performances[index];
  const songs = parsedSongs(p);
  const detailsElement = targetId
    ? document.getElementById(targetId)
    : $("details");

  selectedPerformanceIndex = index;
  hideReopenButton();

  const normal = songs.filter(s=>s.type==="normal");
  const encore = songs.filter(s=>s.type==="encore");
  const collab = songs.filter(s=>s.type==="collab");

  function songRows(items) {
    return `
      <ol class="song-list">
        ${items.map((s,i)=>`
          <li class="song ${s.type}">
            <span class="song-number">
              ${String(i+1).padStart(2,"0")}
            </span>
            <span class="song-name">${s.song}</span>
            ${s.type==="encore"
              ? '<span class="song-mark">ENCORE</span>'
              : ""}
            ${s.type==="collab"
              ? '<span class="song-mark">COLLAB</span>'
              : ""}
          </li>
        `).join("")}
      </ol>
    `;
  }

  let html = `
    <div class="details-top">
      <div>
        <div class="details-title">${p.title}</div>
        <div class="details-meta">
          ${formatDate(p.date)}　/　${p.venue}
        </div>
      </div>
      <button class="close-detail" id="closeDetail" aria-label="셋리스트 닫기">×</button>
    </div>
  `;

  if(normal.length) {
    html += `
      <div class="setlist-label">SETLIST</div>
      ${songRows(normal)}
    `;
  }

  if(encore.length) {
    html += `
      <div class="setlist-label">ENCORE</div>
      ${songRows(encore)}
    `;
  }

  if(collab.length) {
    html += `
      <div class="setlist-label">COLLABORATION / GUEST</div>
      ${songRows(collab)}
    `;
  }

  detailsElement.innerHTML = html;
  detailsElement.classList.add("open");
  hideReopenButton();

  detailsElement.querySelector(".close-detail").addEventListener("click",()=>{
    detailsElement.classList.remove("open");

    if(!targetId) {
      $("reopenDetail").style.display = "inline-block";
    }
  });
}

function normalizeSearch(value) {
  return String(value ?? "")
    .toLowerCase()
    .replace(/[\s\-_.()[\]{}'"’‘,:!&×+]/g, "");
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function highlightText(value, query) {
  const safe = escapeHtml(value);
  const q = String(query ?? "").trim();
  if(!q) return safe;

  const escapedQuery = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try {
    return safe.replace(new RegExp(`(${escapedQuery})`, "ig"), '<span class="search-highlight">$1</span>');
  } catch {
    return safe;
  }
}

// 곡명 표기의 대소문자·띄어쓰기·기호 차이와 관계없이 별칭을 찾도록
// 사전의 곡명도 검색용 형태로 한 번 정규화합니다.
// 곡명에 "(cover)" 등의 부가 표기가 붙어 있어도 기본 곡명 별칭을 연결합니다.
function getAliasesForSong(song) {
  const normalizedSong = normalizeSearch(song);
  return Object.entries(songAliases)
    .filter(([canonical]) => {
      const key = normalizeSearch(canonical);
      return key && (normalizedSong.includes(key) || key.includes(normalizedSong));
    })
    .flatMap(([, aliases]) => aliases);
}

// 별칭도 부분 일치로 검색합니다. 따라서 한 글자만 입력해도 해당 별칭이 포함된 결과가 나옵니다.
function matchesAliasInText(value, query) {
  const normalizedValue = normalizeSearch(value);
  const normalizedQuery = normalizeSearch(query);
  if(!normalizedValue || !normalizedQuery) return false;

  return Object.entries(songAliases).some(([canonical, aliases]) => {
    const canonicalKey = normalizeSearch(canonical);
    const canonicalAppears = normalizedValue.includes(canonicalKey) ||
      canonicalKey.includes(normalizedValue);
    return canonicalAppears &&
      aliases.some(alias => normalizeSearch(alias).includes(normalizedQuery));
  });
}

function getSongMatches(performance, query) {
  const normalizedQuery = normalizeSearch(query);
  if(!normalizedQuery) return [];

  return parsedSongs(performance).filter(({song}) => {
    const normalizedSong = normalizeSearch(song);
    const aliases = getAliasesForSong(song);

    return normalizedSong.includes(normalizedQuery) ||
      aliases.some(alias => normalizeSearch(alias).includes(normalizedQuery));
  }).map(({song, type}) => ({
    song,
    type,
    matchedAliases: getAliasesForSong(song).filter(alias =>
      normalizeSearch(alias).includes(normalizedQuery)
    )
  }));
}

function matchesEventAliasInText(value, query) {
  const normalizedValue = normalizeSearch(value);
  const normalizedQuery = normalizeSearch(query);
  if(!normalizedValue || !normalizedQuery) return false;

  return Object.entries(eventAliases).some(([canonical, aliases]) => {
    const canonicalKey = normalizeSearch(canonical);
    const canonicalAppears = normalizedValue.includes(canonicalKey) ||
      canonicalKey.includes(normalizedValue);
    return canonicalAppears &&
      aliases.some(alias => normalizeSearch(alias).includes(normalizedQuery));
  });
}

function renderSearch() {
  const query = $("searchInput").value.trim();

  if(!query) {
    $("searchResults").innerHTML = "";
    return;
  }

  const normalizedQuery = normalizeSearch(query);
  const results = performances.map((performance, index) => {
    const directFields = [performance.title, performance.venue, performance.artist];
    const directMatch = directFields.some(value =>
      normalizeSearch(value).includes(normalizedQuery) ||
      matchesAliasInText(value, query) ||
      matchesEventAliasInText(value, query)
    );
    const matchedSongs = getSongMatches(performance, query);
    return {performance, index, directMatch, matchedSongs};
  }).filter(result => result.directMatch || result.matchedSongs.length);

  $("searchResults").innerHTML = `
    <div class="search-result-label">
      SEARCH RESULTS — ${results.length}
    </div>

    ${results.length ? results.map(({performance:p, index, matchedSongs})=>`
      <div class="event-card" data-index="${index}">
        <div class="event-date">${formatDate(p.date)}</div>
        <div>
          <div class="event-title">${highlightText(p.title, query)}</div>
          <div class="event-venue">${highlightText(p.venue, query)}</div>
          ${matchedSongs.length ? `
            <div class="search-match">
              ${matchedSongs.map(({song})=>`
                <span class="search-highlight">${escapeHtml(song)}</span>
              `).join(" · ")}
            </div>
          ` : ""}
        </div>
        <div class="event-artist">VIEW ↗</div>
      </div>
    `).join("") : `
      <div class="empty-message">검색 결과가 없습니다.</div>
    `}
  `;

  document.querySelectorAll("#searchResults .event-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const index = Number(card.dataset.index);
      const p = performances[index];

      selectedDate = p.date;
      currentMonth = new Date(
        Number(p.date.slice(0,4)),
        Number(p.date.slice(5,7))-1,
        1
      );

      renderCalendar();
      renderSelectedEvents();
      renderDetails(index);

      $("selectedArea").scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    });
  });
}

$("prevMonth").addEventListener("click",()=>{
  currentMonth = new Date(
    currentMonth.getFullYear(),
    currentMonth.getMonth()-1,
    1
  );
  renderCalendar();
});

$("nextMonth").addEventListener("click",()=>{
  currentMonth = new Date(
    currentMonth.getFullYear(),
    currentMonth.getMonth()+1,
    1
  );
  renderCalendar();
});

$("searchInput").addEventListener("input",renderSearch);

$("clearSearch").addEventListener("click",()=>{
  $("searchInput").value = "";
  renderSearch();
});

$("reopenDetail").addEventListener("click",()=>{
  if(selectedPerformanceIndex !== null) {
    $("details").classList.add("open");
    hideReopenButton();
  }
});
